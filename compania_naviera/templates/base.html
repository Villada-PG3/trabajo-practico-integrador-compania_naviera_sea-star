<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SEA STAR{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
            color: #222;
        }

        header {
            background-color: #003b5c;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #7dd3fc;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
            min-height: 70vh;
        }

        footer {
            background-color: #003b5c;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .boton {
            display: inline-block;
            background-color: #0077b6;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 15px;
        }

        .boton:hover {
            background-color: #005f8f;
        }
    </style>
</head>

<body>

    <header>
        <h1> SEA STAR</h1>

        <nav>
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'navios' %}">Navíos</a>
            <a href="{% url 'itinerarios' %}">Itinerarios</a>
            <a href="{% url 'cruceros' %}">Cruceros</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
