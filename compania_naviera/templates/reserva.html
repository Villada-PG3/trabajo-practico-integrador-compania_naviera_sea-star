{% extends 'base.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservar viaje</title>
</head>
<body>

    <h1>Solicitar reserva</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Solicitar reserva
        </button>
    </form>

    <a href="{% url 'mi_cuenta' %}">
        Volver a mi cuenta
    </a>

</body>
</html>
